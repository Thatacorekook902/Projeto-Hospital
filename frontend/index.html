<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema Hospitalar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      /* Fundo degradê roxo, azul e vermelho */
      background: linear-gradient(
        135deg,
        #6d28d9,
        #2563eb,
        #e11d48
      );
    }

    .container {
      width: 390px;
      padding: 30px 28px;
      background: #ffffff;
      border-radius: 20px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

      border: 3px solid #6d28d9;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /* IMAGEM CENTRALIZADA */
    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    /* TÍTULO */
    h2 {
      color: #6d28d9;
      font-size: 26px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .subtitulo {
      color: #666;
      font-size: 14px;
      margin-bottom: 22px;
    }

    /* TÍTULO DO CADASTRO */
    h3 {
      width: 100%;
      color: #2563eb;
      font-size: 20px;
      margin-bottom: 15px;
    }

    /* CAMPOS */
    input,
    select {
      width: 100%;
      height: 46px;

      margin-bottom: 13px;
      padding: 10px 15px;

      border: 2px solid #7c3aed;
      border-radius: 10px;

      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 5px rgba(37, 99, 235, 0.25);
    }

    /* BOTÃO */
    button {
      width: 100%;
      height: 46px;

      margin-top: 5px;

      border: none;
      border-radius: 10px;

      background: linear-gradient(
        90deg,
        #6d28d9,
        #2563eb,
        #e11d48
      );

      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }

    /* SEPARADOR */
    .separador {
      width: 100%;
      margin: 20px 0;

      border: none;
      border-top: 1px solid #ddd;
    }

    /* LINK PARA LOGIN */
    .login-text {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }

    .login-text span {
      color: #6d28d9;
      font-weight: bold;
      cursor: pointer;
    }

    /* RESPONSIVO */
    @media (max-width: 450px) {
      .container {
        width: 90%;
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- IMAGEM -->
    <img
      src="logo.png"
      alt="Logo do Sistema Hospitalar"
      class="logo"
    >

    <!-- TÍTULO -->
    <h2>🏥 Sistema Hospitalar</h2>

    <p class="subtitulo">
      Sistema de gerenciamento hospitalar
    </p>

    <!-- CADASTRO -->
    <h3>Cadastro de Usuário</h3>

    <input
      type="text"
      id="nome"
      placeholder="Nome completo"
    >

    <input
      type="text"
      id="usuario"
      placeholder="Nome de usuário"
    >

    <input
      type="email"
      id="email"
      placeholder="E-mail"
    >

    <input
      type="password"
      id="senha"
      placeholder="Senha"
    >

    <select id="tipo">
      <option value="">Selecione o tipo de usuário</option>
      <option value="triagem">Triagem</option>
      <option value="medico">Médico</option>
      <option value="atendimento">Atendimento</option>
    </select>

    <button onclick="cadastrar()">
      Cadastrar
    </button>

    <hr class="separador">

    <!-- LOGIN -->
    <p class="login-text">
      Já possui uma conta?
      <span onclick="mostrarLogin()">Entrar</span>
    </p>

  </div>

  <script>

    function cadastrar() {

      const nome = document.getElementById("nome").value;
      const usuario = document.getElementById("usuario").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      const tipo = document.getElementById("tipo").value;

      if (!nome || !usuario || !email || !senha || !tipo) {
        alert("Preencha todos os campos!");
        return;
      }

      fetch("/cadastro", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          nome: nome,
          usuario: usuario,
          email: email,
          senha: senha,
          tipo: tipo
        })
      })

      .then(response => response.json())

      .then(data => {

        if (data.sucesso) {
          alert("Cadastro realizado com sucesso!");

          document.getElementById("nome").value = "";
          document.getElementById("usuario").value = "";
          document.getElementById("email").value = "";
          document.getElementById("senha").value = "";
          document.getElementById("tipo").value = "";
        } else {
          alert(data.mensagem || "Erro ao realizar cadastro.");
        }

      })

      .catch(error => {

        console.error("Erro:", error);

        alert("Não foi possível conectar ao servidor.");

      });

    }

    function mostrarLogin() {
      window.location.href = "login.html";
    }

  </script>

</body>
</html>
