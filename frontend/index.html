<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

<div class="container">

  <img src="logo.png" alt="Logo Pony Med" class="logo">

  <h2>🏥Pony Med</h2>

  <p class="mensagem">
  Cuidando da saúde e dos pequenos sorrisos! </p>

  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">

  <button onclick="login()">Entrar</button>

</div>

<script>
fetch("/login", {
  fetch("/login, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })
  })
  .then(r => r.json())
  .then(data => {
    if(data.tipo === "triagem") location.href = "triagem.html";
    if(data.tipo === "medico") location.href = "medico.html";
    if(data.tipo === "atendimento") location.href = "atendimento.html";
  });
}
</script>

</body>
</html>
