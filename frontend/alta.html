<!DOCTYPE html> 
<html lang="pt-br"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
    <title>Alta do Paciente</title> 
 
    <style> 
 
        * { 
            box-sizing: border-box; 
        } 
 
        body { 
            margin: 0; 
            min-height: 100vh; 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5, #ffebee); 
 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
 
            padding: 35px 20px; 
        } 
 
        .container { 
            width: 100%; 
            max-width: 1200px; 
 
            background: white; 
 
            border-radius: 25px; 
 
            padding: 50px; 
 
            box-shadow: 0 10px 35px rgba(0,0,0,0.18); 
        } 
 
        header { 
            text-align: center; 
 
            background: linear-gradient(135deg, #7b1fa2, #3949ab); 
 
            color: white; 
 
            padding: 45px 30px; 
 
            border-radius: 22px; 
 
            margin-bottom: 45px; 
 
            box-shadow: 0 6px 18px rgba(63, 81, 181, 0.25); 
        } 
 
        header h1 { 
            font-size: 48px; 
            margin: 0 0 18px 0; 
            letter-spacing: 1px; 
        } 
 
        header p { 
            font-size: 25px; 
            margin: 0; 
            line-height: 1.5; 
        } 
 
        .formulario { 
            padding: 10px 15px; 
        } 
 
        .campo { 
            margin-bottom: 35px; 
        } 
 
        .campo label { 
            display: block; 
 
            font-size: 27px; 
 
            font-weight: bold; 
 
            margin-bottom: 14px; 
 
            color: #333; 
        } 
 
        .campo input, 
        .campo textarea, 
        .campo select { 
            width: 100%; 
 
            padding: 20px 22px; 
 
            font-size: 24px; 
 
            border: 2px solid #c9d2ed; 
 
            border-radius: 14px; 
 
            outline: none; 
 
            background: #fafbff; 
 
            color: #222; 
 
            min-height: 65px; 
        } 
 
        .campo input::placeholder, 
        .campo textarea::placeholder { 
            color: #888; 
            font-size: 21px; 
        } 
 
        .campo textarea { 
            min-height: 180px; 
 
            resize: vertical; 
 
            line-height: 1.5; 
        } 
 
        .campo input:focus, 
        .campo textarea:focus, 
        .campo select:focus { 
            border-color: #7b1fa2; 
 
            background: white; 
 
            box-shadow: 0 0 0 4px rgba(123, 31, 162, 0.10); 
        } 
 
        /* Organização dos campos em blocos */ 
 
        .campo::before { 
            content: ""; 
            display: block; 
        } 
 
        .botoes { 
            display: flex; 
 
            justify-content: center; 
 
            gap: 25px; 
 
            margin-top: 45px; 
 
            flex-wrap: wrap; 
        } 
 
        .btn { 
            padding: 20px 38px; 
 
            font-size: 23px; 
 
            font-weight: bold; 
 
            border: none; 
 
            border-radius: 14px; 
 
            cursor: pointer; 
 
            min-width: 280px; 
 
            transition: 0.2s; 
        } 
 
        .btn-pdf { 
            background: #7b1fa2; 
 
            color: white; 
 
            box-shadow: 0 5px 12px rgba(123, 31, 162, 0.25); 
        } 
 
        .btn-voltar { 
            background: #3949ab; 
 
            color: white; 
 
            box-shadow: 0 5px 12px rgba(57, 73, 171, 0.25); 
        } 
 
        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(-2px); 
        } 
 
        /* Separadores visuais */ 
 
        .campo:not(:last-child) { 
            padding-bottom: 10px; 
        } 
 
        @media (max-width: 700px) { 
 
            body { 
                padding: 15px 10px; 
            } 
 
            .container { 
                padding: 25px 18px; 
                border-radius: 18px; 
            } 
 
            header { 
                padding: 30px 15px; 
            } 
 
            header h1 { 
                font-size: 36px; 
            } 
 
            header p { 
                font-size: 20px; 
            } 
 
            .campo label { 
                font-size: 22px; 
            } 
 
            .campo input, 
            .campo textarea, 
            .campo select { 
                font-size: 20px; 
            } 
 
            .btn { 
                width: 100%; 
                min-width: 0; 
            } 
 
        } 
 
        @media print { 
 
            body { 
                background: white; 
                padding: 0; 
            } 
 
            .container { 
                box-shadow: none; 
                max-width: 100%; 
                padding: 20px; 
            } 
 
            header { 
                box-shadow: none; 
            } 
 
            .botoes { 
                display: none; 
            } 
 
        } 
 
    </style> 
 
</head> 
 
<body> 
 
    <div class="container"> 
 
        <header> 
 
            <h1>🏥 Alta do Paciente</h1> 
 
            <p>Formulário de alta e acompanhamento do paciente</p> 
 
        </header> 
 
        <div class="formulario"> 
 
            <div class="campo"> 
 
                <label>👤 Nome do Paciente</label> 
 
                <input 
                    type="text" 
                    id="paciente" 
                    placeholder="Digite o nome completo do paciente" 
                > 
 
            </div> 
 
            <div class="campo"> 
 
                <label>🩺 Diagnóstico</label> 
 
                <input 
                    type="text" 
                    id="diagnostico" 
                    placeholder="Digite o diagnóstico do paciente" 
                > 
 
            </div> 
 
            <div class="campo"> 
 
                <label>💊 Medicação</label> 
 
                <input 
                    type="text" 
                    id="medicacao" 
                    placeholder="Digite a medicação prescrita" 
                > 
 
            </div> 
 
            <div class="campo"> 
 
                <label>📋 Orientações para o paciente</label> 
 
                <textarea 
                    id="orientacoes" 
                    placeholder="Digite as orientações, cuidados, horários dos medicamentos e recomendações..."
                ></textarea> 
 
            </div> 
 
            <div class="campo"> 
 
                <label>📝 Observações</label> 
 
                <textarea 
                    id="observacoes" 
                    placeholder="Digite outras informações importantes sobre a alta do paciente..."
                ></textarea> 
 
            </div> 
 
            <div class="botoes"> 
 
                <button 
                    class="btn btn-pdf" 
                    onclick="window.print()" 
                > 
                    ⬇️ Baixar PDF 
                </button> 
 
                <button 
                    class="btn btn-voltar" 
                    onclick="window.location.href='medico.html'" 
                > 
                    ← Voltar para o Painel Médico 
                </button> 
 
            </div> 
 
        </div> 
 
    </div> 
 
</body> 
 
</html>
