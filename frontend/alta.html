<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alta do Paciente</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5, #ffebee);

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        header {
            text-align: center;

            background: linear-gradient(135deg, #7b1fa2, #3949ab);

            color: white;

            padding: 35px;

            border-radius: 18px;

            margin-bottom: 35px;
        }

        header h1 {
            font-size: 38px;
            margin: 0 0 15px 0;
        }

        header p {
            font-size: 21px;
            margin: 0;
        }

        .formulario {
            padding: 20px;
        }

        .campo {
            margin-bottom: 25px;
        }

        .campo label {
            display: block;

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .campo input,
        .campo textarea,
        .campo select {
            width: 100%;

            padding: 16px;

            font-size: 20px;

            border: 2px solid #d0d8f0;

            border-radius: 10px;

            outline: none;
        }

        .campo textarea {
            min-height: 130px;

            resize: vertical;
        }

        .campo input:focus,
        .campo textarea:focus,
        .campo select:focus {
            border-color: #7b1fa2;
        }

        .botoes {
            display: flex;

            justify-content: center;

            gap: 20px;

            margin-top: 35px;

            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 30px;

            font-size: 20px;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            cursor: pointer;
        }

        .btn-pdf {
            background: #7b1fa2;

            color: white;
        }

        .btn-voltar {
            background: #3949ab;

            color: white;
        }

        .btn:hover {
            opacity: 0.85;
        }

        @media print {

            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                max-width: 100%;
            }

            .botoes {
                display: none;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <header>

            <h1>🏥 Alta do Paciente</h1>

            <p>Formulário de alta e acompanhamento do paciente</p>

        </header>


        <div class="formulario">

            <div class="campo">

                <label>Nome do Paciente</label>

                <input
                    type="text"
                    id="paciente"
                    placeholder="Digite o nome do paciente"
                >

            </div>


            <div class="campo">

                <label>Diagnóstico</label>

                <input
                    type="text"
                    id="diagnostico"
                    placeholder="Digite o diagnóstico"
                >

            </div>


            <div class="campo">

                <label>Medicação</label>

                <input
                    type="text"
                    id="medicacao"
                    placeholder="Digite a medicação"
                >

            </div>


            <div class="campo">

                <label>Orientações para o paciente</label>

                <textarea
                    id="orientacoes"
                    placeholder="Digite as orientações para o paciente..."
                ></textarea>

            </div>


            <div class="campo">

                <label>Observações</label>

                <textarea
                    id="observacoes"
                    placeholder="Digite outras observações..."
                ></textarea>

            </div>


            <div class="botoes">

                <button
                    class="btn btn-pdf"
                    onclick="window.print()"
                >
                    ⬇️ Baixar PDF
                </button>


                <button
                    class="btn btn-voltar"
                    onclick="window.location.href='medico.html'"
                >
                    ← Voltar para o Painel Médico
                </button>

            </div>

        </div>

    </div>

</body>

</html>
