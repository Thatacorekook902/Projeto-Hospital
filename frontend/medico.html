<!DOCTYPE html>  
<html>  
<head>  
  <link rel="stylesheet" href="css/style.css">  
 
  <style>  

    /* ============================= */
    /* TAMANHOS MAIORES - PAINEL MÉDICO */
    /* ============================= */

    .container {
      font-size: 20px;
    }

    .container h2 {
      font-size: 38px !important;
    }

    .container h3 {
      font-size: 30px !important;
    }

    .container p {
      font-size: 23px;
      line-height: 1.5;
    }

    .card {
      padding: 25px !important;
      margin-bottom: 25px !important;
      border-radius: 15px !important;
    }

    .card h3 {
      font-size: 32px !important;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 23px !important;
      margin: 10px 0 !important;
      line-height: 1.5;
    }

    .card button {
      font-size: 21px !important;
      padding: 14px 22px !important;
      border-radius: 10px !important;
    }

    /* ============================= */
    /* BOTÃO TV */
    /* ============================= */

    .btn-tv {  
      background: #28a745;  
      color: white;  
      border: none;  
      padding: 14px 22px;  
      border-radius: 10px;  
      cursor: pointer;  
      font-size: 21px;  
      font-weight: bold;
      margin-top: 8px;  
    }  
 
    .btn-tv:hover {  
      background: #1e7e34;  
    }  
 
    /* ============================= */
    /* BOTÃO ABRIR TV */
    /* ============================= */

    .btn-abrir-tv {  
      background: #17a2b8;  
      color: white;  
      border: none;  
      padding: 15px 22px;  
      border-radius: 10px;  
      font-size: 20px;  
      font-weight: bold;
      cursor: pointer;  
    }  
 
    .btn-abrir-tv:hover {  
      background: #117a8b;  
    }  
 
    /* ============================= */
    /* BOTÃO ALTA DO PACIENTE */
    /* ============================= */

    .btn-alta {  
      background: #8e24aa;  
      color: white;  
      border: none;  
      padding: 15px 22px;  
      border-radius: 10px;  
      font-size: 20px;  
      font-weight: bold;  
      cursor: pointer;  
      margin-left: 10px; 
    } 
 
    .btn-alta:hover {  
      background: #6a1b7b;  
    } 
 
    /* ============================= */
    /* CONSULTÓRIO */
    /* ============================= */

    .consultorio-input {  
      display: flex;  
      align-items: center;  
      gap: 15px;  
      margin-bottom: 25px;  
      background: #f0f4ff;  
      padding: 18px 20px;  
      border-radius: 10px;  
      border: 1px solid #d0d8f0;  
    }  
 
    .consultorio-input label {  
      font-weight: bold;
      font-size: 23px;
    }  
 
    .consultorio-input input {  
      width: 80px;  
      height: 55px;
      text-align: center;  
      font-size: 23px;  
      font-weight: bold;  
      padding: 8px;  
      border: 1px solid #ccc;  
      border-radius: 8px;  
    }

    .consultorio-input span {
      font-size: 18px !important;
    }

    /* ============================= */
    /* ÁREA DE CONSULTA */
    /* ============================= */

    #paciente,
    #diagnostico,
    #medicacao,
    #obs {
      font-size: 22px !important;
      padding: 16px !important;
      min-height: 58px;
      border-radius: 10px;
    }

    #obs {
      min-height: 140px;
    }

    .container > button {
      font-size: 22px !important;
      padding: 15px 30px !important;
      border-radius: 10px !important;
    }

    /* ============================= */
    /* RESPONSIVO */
    /* ============================= */

    @media (max-width: 700px) {

      .container h2 {
        font-size: 30px !important;
      }

      .container h3 {
        font-size: 26px !important;
      }

      .card h3 {
        font-size: 28px !important;
      }

      .card p {
        font-size: 20px !important;
      }

      .btn-abrir-tv,
      .btn-alta {
        font-size: 17px;
        padding: 12px 15px;
      }

      .consultorio-input {
        flex-wrap: wrap;
      }

    }

  </style>  
</head>  
  
<body>  
  
<div class="container">  
  
  <!-- Cabeçalho com botões -->  
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">  
 
    <h2 style="margin:0;">🩺 Painel Médico</h2>  
 
    <div> 
      <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')"> 
        📺 Abrir Tela da TV 
      </button> 
 
      <!-- BOTÃO NOVO --> 
      <button class="btn-alta" onclick="window.location.href='alta.html'"> 
        🏥 Alta do Paciente 
      </button> 
    </div> 
 
  </div>  
  
  <!-- Campo criado para informar o consultório e chamar o paciente na TV -->  
  <div class="consultorio-input">  
    <label>Meu Consultório:</label>  
    <input type="text" id="consultorio-num" value="01">  
    <span style="color:#666; font-size:13px;"> 
      Este número será exibido na TV ao chamar o paciente. 
    </span>  
  </div>  
  
  <div id="triagens"></div>  
  
  <hr>  
  
  <h3>Consulta</h3>  
  
  <input id="paciente" placeholder="Paciente" readonly>  
  <input id="diagnostico" placeholder="Diagnóstico">  
  
  <select id="medicacao">  
    <option value="">Selecione a medicação</option>  
  </select>  
  
  <textarea id="obs" placeholder="Observações"></textarea>  
  
  <button onclick="salvar()">Salvar</button>  
  
</div>  
  
<script>  
  
let triagensCarregadas = [];  
  
function carregar() {  
  fetch("/triagens")  
    .then(r => r.json())  
    .then(data => {  
      triagensCarregadas = data;  
  
      const div = document.getElementById("triagens");  
      div.innerHTML = "";  
  
      if (data.length === 0) {  
        div.innerHTML = "<p style='color:#888; text-align:center;'>Nenhum paciente na fila.</p>";  
        return;  
      }  
  
      data.forEach((t, index) => {  
        div.innerHTML += `  
          <div class="card">  
            <h3>${t.nome}</h3>  
            <p><b>Sintoma:</b> ${t.sintoma || "Não informado"}</p>  
            <p><b>Temperatura:</b> ${t.temperatura || "Não informada"}°C</p>  
            <p><span class="${t.risco}">${t.risco}</span></p>  
            <p><b>Alergia:</b> ${t.alergia || "Nenhuma"}</p>  
            <p><b>Observação:</b> ${t.observacao || "Nenhuma"}</p>  
            <div style="display:flex; gap:8px; flex-wrap:wrap;">  
              <button onclick="selecionar(${index})">Atender</button>  
              <button class="btn-tv" onclick="chamarNaTV('${t.nome}')"> 
                📺 Chamar na TV 
              </button>  
            </div>  
          </div>  
        `;  
      });  
    });  
}  
  
function chamarNaTV(nome) {  
  const consultorio = document.getElementById("consultorio-num").value || "01"; 
 
  fetch("/tv/chamar", {  
    method: "POST",  
    headers: { "Content-Type": "application/json" },  
    body: JSON.stringify({  
      localTipo: "CONSULTÓRIO",  
      localNumero: consultorio,  
      paciente: nome  
    })  
  })  
  .then(r => r.json())  
  .then(() => {  
    alert("✅ " + nome + " foi chamado na TV para o Consultório " + consultorio + "!");  
  });  
}  
  
function selecionar(index) {  
  const t = triagensCarregadas[index];  
  document.getElementById("paciente").value = t.nome;  
  document.getElementById("obs").value = t.observacao || "";  
  
  if (t.alergia && t.alergia !== "Nenhuma") {  
    alert("⚠️ Paciente possui alergia: " + t.alergia);  
  }  
}  
  
function carregarMedicacoes() {  
  fetch("/lista-medicacoes") 
    .then(r => r.json())  
    .then(data => {  
      const select = document.getElementById("medicacao");  
      select.innerHTML = `<option value="">Selecione a medicação</option>`;  
      data.forEach(med => {  
        const option = document.createElement("option");  
        option.value = med;  
        option.textContent = med;  
        select.appendChild(option);  
      });  
    });  
}  
  
function salvar() {  
  const paciente = document.getElementById("paciente").value;  
  const diagnostico = document.getElementById("diagnostico").value;  
  const medicacao = document.getElementById("medicacao").value;  
  const obs = document.getElementById("obs").value;  
  
  if (!paciente) {  
    alert("Selecione um paciente clicando em Atender.");  
    return;  
  } 
 
  if (!medicacao) {  
    alert("Selecione uma medicação.");  
    return;  
  }  
  
  fetch("/consulta", {  
    method: "POST",  
    headers: { "Content-Type": "application/json" },  
    body: JSON.stringify({ paciente, diagnostico, medicacao, obs })  
  })  
  .then(r => r.json())  
  .then(() => {  
    alert("Consulta salva");  
    document.getElementById("diagnostico").value = "";  
    document.getElementById("medicacao").value = "";  
    document.getElementById("obs").value = "";  
  });  
}  
  
carregar();  
carregarMedicacoes();  
  
setInterval(carregar, 10000);  
  
</script>  
  
</body>  
</html>
