<!DOCTYPE html>   
<html>   
<head>   
  <link rel="stylesheet" href="css/style.css">   
   
  <style> 
 
    /* ========================================= 
       VISUAL GERAL - IGUAL À TELA DE ALTA 
       ========================================= */ 
 
    * { 
      box-sizing: border-box; 
    } 
 
    body { 
      margin: 0; 
      min-height: 100vh; 
      font-family: Arial, sans-serif; 
 
      background: linear-gradient( 
        135deg, 
        #e3f2fd, 
        #f3e5f5, 
        #ffebee 
      ); 
 
      padding: 35px 20px; 
    } 
 
    /* PAINEL BRANCO PRINCIPAL */ 
 
    .container { 
      width: 100%; 
      max-width: 1200px; 
 
      margin: 0 auto; 
 
      background: white; 
 
      border-radius: 25px; 
 
      padding: 50px; 
 
      box-shadow: 0 10px 35px rgba(0,0,0,0.18); 
 
      font-size: 20px; 
    } 
 
 
    /* ========================================= 
       CABEÇALHO 
       ========================================= */ 
 
    .cabecalho-medico { 
      text-align: center; 
 
      background: linear-gradient( 
        135deg, 
        #7b1fa2, 
        #3949ab 
      ); 
 
      color: white; 
 
      padding: 40px 30px; 
 
      border-radius: 22px; 
 
      margin-bottom: 35px; 
 
      box-shadow: 0 6px 18px rgba(63,81,181,0.25); 
    } 
 
    .cabecalho-medico h2 { 
      font-size: 48px !important; 
 
      margin: 0 0 25px 0 !important; 
 
      letter-spacing: 1px; 
    } 
 
 
    /* ========================================= 
       BOTÃO ABRIR TV 
       ========================================= */ 
 
    .btn-abrir-tv { 
 
      background: #17a2b8; 
 
      color: white; 
 
      border: none; 
 
      padding: 17px 28px; 
 
      border-radius: 12px; 
 
      font-size: 22px; 
 
      font-weight: bold; 
 
      cursor: pointer; 
 
      margin: 5px; 
    } 
 
    .btn-abrir-tv:hover { 
      background: #117a8b; 
    } 
 
 
    /* ========================================= 
       BOTÃO ALTA 
       ========================================= */ 
 
    .btn-alta { 
 
      background: #8e24aa; 
 
      color: white; 
 
      border: none; 
 
      padding: 17px 28px; 
 
      border-radius: 12px; 
 
      font-size: 22px; 
 
      font-weight: bold; 
 
      cursor: pointer; 
 
      margin: 5px; 
    } 
 
    .btn-alta:hover { 
      background: #6a1b7b; 
    } 


    /* =========================================
       BOTÃO INTERNAÇÃO
       ========================================= */

    .btn-internacao {

      background: #d32f2f;

      color: white;

      border: none;

      padding: 17px 28px;

      border-radius: 12px;

      font-size: 22px;

      font-weight: bold;

      cursor: pointer;

      margin: 5px;
    }

    .btn-internacao:hover {

      background: #b71c1c;
    }
 
 
    /* ========================================= 
       ÁREA DO CONSULTÓRIO 
       ========================================= */ 
 
    .consultorio-input { 
 
      display: flex; 
 
      align-items: center; 
 
      gap: 18px; 
 
      margin-bottom: 35px; 
 
      background: #f0f4ff; 
 
      padding: 22px; 
 
      border-radius: 14px; 
 
      border: 2px solid #d0d8f0; 
 
      flex-wrap: wrap; 
    } 
 
    .consultorio-input label { 
 
      font-weight: bold; 
 
      font-size: 25px; 
    } 
 
    .consultorio-input input { 
 
      width: 90px; 
 
      height: 60px; 
 
      text-align: center; 
 
      font-size: 25px; 
 
      font-weight: bold; 
 
      padding: 8px; 
 
      border: 2px solid #ccc; 
 
      border-radius: 10px; 
    } 
 
    .consultorio-input span { 
 
      color: #666; 
 
      font-size: 18px !important; 
 
      line-height: 1.5; 
    } 
 
 
    /* ========================================= 
       LISTA DE PACIENTES 
       ========================================= */ 
 
    #triagens { 
      width: 100%; 
    } 
 
 
    /* CARTÃO DO PACIENTE */ 
 
    .card { 
 
      background: #fafbff; 
 
      border: 2px solid #d0d8f0; 
 
      border-radius: 18px; 
 
      padding: 30px !important; 
 
      margin-bottom: 30px !important; 
 
      box-shadow: 0 5px 15px rgba(0,0,0,0.08); 
 
      transition: 0.2s; 
    } 
 
    .card:hover { 
 
      transform: translateY(-2px); 
 
      box-shadow: 0 8px 20px rgba(0,0,0,0.12); 
    } 
 
 
    /* NOME DO PACIENTE */ 
 
    .card h3 { 
 
      font-size: 34px !important; 
 
      text-align: center; 
 
      color: #7b1fa2; 
 
      margin: 0 0 25px 0 !important; 
 
      padding-bottom: 15px; 
 
      border-bottom: 2px solid #e0e4f5; 
    } 
 
 
    /* INFORMAÇÕES */ 
 
    .card p { 
 
      font-size: 24px !important; 
 
      line-height: 1.6; 
 
      margin: 12px 0 !important; 
 
      color: #222; 
    } 
 
    .card p b { 
 
      font-weight: bold; 
 
      color: #333; 
    } 
 
 
    /* ========================================= 
       BOTÕES DENTRO DOS PACIENTES 
       ========================================= */ 
 
    .card button { 
 
      font-size: 22px !important; 
 
      font-weight: bold; 
 
      padding: 16px 28px !important; 
 
      border-radius: 12px !important; 
 
      cursor: pointer; 
    } 
 
 
    /* BOTÃO CHAMAR TV */ 
 
    .btn-tv { 
 
      background: #28a745; 
 
      color: white; 
 
      border: none; 
 
      padding: 16px 28px; 
 
      border-radius: 12px; 
 
      cursor: pointer; 
 
      font-size: 22px; 
 
      font-weight: bold; 
 
      margin-top: 8px; 
    } 
 
    .btn-tv:hover { 
      background: #1e7e34; 
    } 
 
 
    /* ========================================= 
       ÁREA DE CONSULTA 
       ========================================= */ 
 
    .container > h3 { 
 
      font-size: 34px !important; 
 
      color: #7b1fa2; 
 
      margin-top: 40px; 
 
      margin-bottom: 25px; 
 
      text-align: center; 
    } 
 
 
    /* CAMPOS */ 
 
    #paciente, 
    #diagnostico, 
    #medicacao, 
    #obs { 
 
      width: 100%; 
 
      padding: 20px 22px !important; 
 
      font-size: 24px !important; 
 
      border: 2px solid #c9d2ed; 
 
      border-radius: 14px; 
 
      outline: none; 
 
      background: #fafbff; 
 
      color: #222; 
 
      margin-bottom: 22px; 
    } 
 
 
    #paciente, 
    #diagnostico, 
    #medicacao { 
 
      min-height: 68px; 
    } 
 
 
    #obs { 
 
      min-height: 190px; 
 
      resize: vertical; 
 
      line-height: 1.5; 
    } 
 
 
    #paciente:focus, 
    #diagnostico:focus, 
    #medicacao:focus, 
    #obs:focus { 
 
      border-color: #7b1fa2; 
 
      background: white; 
 
      box-shadow: 0 0 0 4px rgba(123,31,162,0.10); 
    } 
 
 
    /* PLACEHOLDER */ 
 
    #paciente::placeholder, 
    #diagnostico::placeholder, 
    #obs::placeholder { 
 
      color: #888; 
 
      font-size: 21px; 
    } 
 
 
    /* ========================================= 
       BOTÃO SALVAR 
       ========================================= */ 
 
    .container > button { 
 
      display: block; 
 
      width: 100%; 
 
      padding: 20px 30px !important; 
 
      font-size: 25px !important; 
 
      font-weight: bold; 
 
      color: white; 
 
      background: linear-gradient( 
        135deg, 
        #7b1fa2, 
        #3949ab 
      ); 
 
      border: none; 
 
      border-radius: 14px; 
 
      cursor: pointer; 
 
      margin-top: 10px; 
 
      box-shadow: 0 5px 12px rgba(63,81,181,0.25); 
    } 
 
    .container > button:hover { 
 
      opacity: 0.9; 
 
      transform: translateY(-2px); 
    } 
 
 
    /* ========================================= 
       LINHA 
       ========================================= */ 
 
    hr { 
 
      border: none; 
 
      height: 2px; 
 
      background: #e0e4f5; 
 
      margin: 40px 0; 
    } 
 
 
    /* ========================================= 
       RESPONSIVO 
       ========================================= */ 
 
    @media (max-width: 700px) { 
 
      body { 
 
        padding: 15px 10px; 
      } 
 
      .container { 
 
        padding: 25px 18px; 
 
        border-radius: 18px; 
      } 
 
      .cabecalho-medico { 
 
        padding: 30px 15px; 
      } 
 
      .cabecalho-medico h2 { 
 
        font-size: 36px !important; 
      } 
 
      .btn-abrir-tv, 
      .btn-alta,
      .btn-internacao { 
 
        font-size: 18px; 
 
        padding: 14px 18px; 
      } 
 
      .card { 
 
        padding: 22px !important; 
      } 
 
      .card h3 { 
 
        font-size: 28px !important; 
      } 
 
      .card p { 
 
        font-size: 20px !important; 
      } 
 
      #paciente, 
      #diagnostico, 
      #medicacao, 
      #obs { 
 
        font-size: 20px !important; 
      } 
 
    } 
 
  </style>   
</head>   
   
<body>   
   
<div class="container">   
   
  <!-- CABEÇALHO -->   
 
  <div class="cabecalho-medico"> 
 
    <h2>🩺 Painel Médico</h2> 
 
    <div> 
 
      <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">  
        📺 Abrir Tela da TV  
      </button>  
  
      <button class="btn-alta" onclick="window.location.href='alta.html'">  
        🏥 Alta do Paciente  
      </button> 

      <button class="btn-internacao" onclick="window.location.href='internacao.html'"> 
        Internação do Paciente 
      </button>
 
    </div> 
 
  </div> 
   
   
  <!-- CONSULTÓRIO -->   
 
  <div class="consultorio-input">   
 
    <label>Meu Consultório:</label>   
 
    <input  
      type="text"  
      id="consultorio-num"  
      value="01" 
    >   
 
    <span>  
      Este número será exibido na TV ao chamar o paciente.  
    </span>   
 
  </div>   
   
   
  <!-- PACIENTES -->   
 
  <div id="triagens"></div>   
   
   
  <hr>   
   
   
  <!-- CONSULTA -->   
 
  <h3>Consulta</h3>   
   
  <input  
    id="paciente"  
    placeholder="Paciente"  
    readonly 
  >   
 
  <input  
    id="diagnostico"  
    placeholder="Diagnóstico" 
  >   
   
  <select id="medicacao">   
 
    <option value=""> 
      Selecione a medicação 
    </option> 
 
  </select>   
   
  <textarea  
    id="obs"  
    placeholder="Observações" 
  ></textarea>   
   
  <button onclick="salvar()"> 
    💾 Salvar Consulta 
  </button>   
   
</div>   
   
<script>   
   
let triagensCarregadas = [];   
   
function carregar() {   
  fetch("/triagens")   
    .then(r => r.json())   
    .then(data => {   
      triagensCarregadas = data;   
   
      const div = document.getElementById("triagens");   
      div.innerHTML = "";   
   
      if (data.length === 0) {   
        div.innerHTML = "<p style='color:#888; text-align:center; font-size:22px;'>Nenhum paciente na fila.</p>";   
        return;   
      }   
   
      data.forEach((t, index) => {   
        div.innerHTML += `   
          <div class="card">   
            <h3>${t.nome}</h3>   
            <p><b>Sintoma:</b> ${t.sintoma || "Não informado"}</p>   
            <p><b>Temperatura:</b> ${t.temperatura || "Não informada"}°C</p>   
            <p><span class="${t.risco}">${t.risco}</span></p>   
            <p><b>Alergia:</b> ${t.alergia || "Nenhuma"}</p>   
            <p><b>Observação:</b> ${t.observacao || "Nenhuma"}</p>   
            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:20px;">   
              <button onclick="selecionar(${index})">Atender</button>   
              <button class="btn-tv" onclick="chamarNaTV('${t.nome}')">  
                📺 Chamar na TV  
              </button>   
            </div>   
          </div>   
        `;   
      });   
    });   
}   
   
function chamarNaTV(nome) {   
  const consultorio = document.getElementById("consultorio-num").value || "01";  
  
  fetch("/tv/chamar", {   
    method: "POST",   
    headers: { "Content-Type": "application/json" },   
    body: JSON.stringify({   
      localTipo: "CONSULTÓRIO",   
      localNumero: consultorio,   
      paciente: nome   
    })   
  })   
  .then(r => r.json())   
  .then(() => {   
    alert("✅ " + nome + " foi chamado na TV para o Consultório " + consultorio + "!");   
  });   
}   
   
function selecionar(index) {   
  const t = triagensCarregadas[index];   
  document.getElementById("paciente").value = t.nome;   
  document.getElementById("obs").value = t.observacao || "";   
   
  if (t.alergia && t.alergia !== "Nenhuma") {   
    alert("⚠️ Paciente possui alergia: " + t.alergia);   
  }   
}   
   
function carregarMedicacoes() {   
  fetch("/lista-medicacoes")  
    .then(r => r.json())   
    .then(data => {   
      const select = document.getElementById("medicacao");   
      select.innerHTML = `<option value="">Selecione a medicação</option>`;   
      data.forEach(med => {   
        const option = document.createElement("option");   
        option.value = med;   
        option.textContent = med;   
        select.appendChild(option);   
      });   
    });   
}   
   
function salvar() {   
  const paciente = document.getElementById("paciente").value;   
  const diagnostico = document.getElementById("diagnostico").value;   
  const medicacao = document.getElementById("medicacao").value;   
  const obs = document.getElementById("obs").value;   
   
  if (!paciente) {   
    alert("Selecione um paciente clicando em Atender.");   
    return;   
  }  
  
  if (!medicacao) {   
    alert("Selecione uma medicação.");   
    return;   
  }   
   
  fetch("/consulta", {   
    method: "POST",   
    headers: { "Content-Type": "application/json" },   
    body: JSON.stringify({ paciente, diagnostico, medicacao, obs })   
  })   
  .then(r => r.json())   
  .then(() => {   
    alert("Consulta salva");   
    document.getElementById("diagnostico").value = "";   
    document.getElementById("medicacao").value = "";   
    document.getElementById("obs").value = "";   
  });   
}   
   
carregar();   
carregarMedicacoes();   
   
setInterval(carregar, 10000);   
   
</script>   
   
</body>   
</html>
