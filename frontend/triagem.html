<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triagem - Pony Med</title> 
<link rel="stylesheet" href="style.css"> 

<style> 

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;

  /* SOMENTE A IMAGEM DE FUNDO */
  background: url("fundo.png") center center / cover fixed no-repeat;

  color: #333;
  padding: 30px 15px;
}

/* CONTAINER PRINCIPAL */
.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  background: rgba(255, 255, 255, 0.96);
  padding: 30px;
  border-radius: 22px;
  box-shadow: 
    0 10px 35px rgba(76, 54, 150, 0.20),
    0 0 25px rgba(236, 139, 190, 0.18);
  border-top: 6px solid #6c3dcc;
  position: relative;
  z-index: 1;
}

/* CABEÇALHO */
.container > div:first-child {
  background: linear-gradient(135deg, #6c3dcc, #b45ac8, #e53935);
  padding: 18px 22px;
  border-radius: 16px;
  color: white;
  box-shadow: 0 5px 15px rgba(86, 49, 184, 0.25);
}

.container h2 {
  font-size: 25px;
  font-weight: 700;
}

/* BOTÃO DA TV */
.btn-abrir-tv {
  display: inline-block;
  background: #e53935 !important;
  color: white;
  padding: 10px 17px !important;
  border-radius: 10px !important;
  font-size: 14px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: 0.3s;
  box-shadow: 0 4px 10px rgba(229, 57, 53, 0.25);
}

.btn-abrir-tv:hover {
  background: #c62828 !important;
  transform: translateY(-2px);
}

/* FILA DE PACIENTES */
.pacientes-fila {
  margin: 25px 0 30px;
  background: linear-gradient(
    135deg,
    #faf5ff,
    #fff0f7
  );
  border-radius: 16px;
  padding: 20px;
  border: 2px solid #ded4ff;
  box-shadow: 0 4px 12px rgba(108, 61, 204, 0.08);
}

.pacientes-fila h3 {
  margin-top: 0;
  margin-bottom: 18px;
  color: #4d2ca3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  font-size: 18px;
}

.pacientes-fila h3 span {
  font-size: 13px;
  font-weight: normal;
  color: #6d6d6d;
}

/* ITEM DO PACIENTE */
.fila-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  border-left: 5px solid #2879e8;
  border-top: 1px solid #e0d5f5;
  border-right: 1px solid #e0d5f5;
  border-bottom: 1px solid #e0d5f5;
  transition: 0.3s;
}

.fila-item:hover {
  transform: translateX(3px);
  box-shadow: 0 5px 15px rgba(40, 121, 232, 0.12);
}

.fila-item strong {
  font-size: 16px;
  color: #3e3190;
}

.fila-item small {
  color: #777;
  font-size: 12px;
}

/* BOTÃO CHAMAR NA TV */
.btn-tv {
  background: #e53935 !important;
  color: white;
  border: none;
  padding: 9px 15px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  margin-left: 8px;
  transition: 0.3s;
}

.btn-tv:hover {
  background: #c62828 !important;
  transform: scale(1.03);
}

/* BOTÃO ATUALIZAR */
.pacientes-fila > button {
  background: #2879e8 !important;
  padding: 9px 15px !important;
  border-radius: 9px !important;
  font-weight: bold;
}

.pacientes-fila > button:hover {
  background: #145fc2 !important;
}

/* LINHA */
hr {
  border: none;
  height: 3px;
  background: linear-gradient(
    to right,
    #6c3dcc,
    #b45ac8,
    #e88bc0,
    #e53935,
    #2879e8
  );
  margin: 25px 0;
  border-radius: 10px;
}

/* TÍTULO DO FORMULÁRIO */
.container > h3 {
  color: #4d2ca3;
  font-size: 21px;
  margin-bottom: 18px;
}

/* CAMPOS */
input,
select,
textarea {
  width: 100%;
  padding: 13px 15px;
  margin-bottom: 14px;
  border: 2px solid #d9d8ef;
  border-radius: 11px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  background: #fafaff;
  transition: 0.3s;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #b45ac8;
  background: white;
  box-shadow: 0 0 0 3px rgba(180, 90, 200, 0.12);
}

textarea {
  min-height: 110px;
  resize: vertical;
}

/* PLACEHOLDER */
input::placeholder,
textarea::placeholder {
  color: #999;
}

/* RESULTADO */
#resultado {
  width: 100%;
  padding: 13px;
  margin: 5px 0 15px;
  border-radius: 11px;
  text-align: center;
  font-weight: bold;
  font-size: 15px;
}

/* CLASSIFICAÇÃO DE RISCO */
#resultado.verde {
  background: #e5f8ea;
  color: #16843b;
  border: 2px solid #79d995;
}

#resultado.amarelo {
  background: #fff8dc;
  color: #a87900;
  border: 2px solid #f2cf4a;
}

#resultado.vermelho {
  background: #ffe8e8;
  color: #c62828;
  border: 2px solid #ef7777;
}

/* BOTÃO SALVAR */
.container > button:last-child {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(
    135deg,
    #6c3dcc,
    #b45ac8,
    #e53935
  );
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(76, 54, 150, 0.25);
  transition: 0.3s;
}

.container > button:last-child:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(76, 54, 150, 0.3);
}

/* RESPONSIVO */
@media (max-width: 700px) {

  body {
    padding: 15px 10px;
  }

  body::before {
    font-size: 16px;
    letter-spacing: 4px;
  }

  .container {
    padding: 18px;
    border-radius: 16px;
  }

  .container > div:first-child {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 12px;
  }

  .container h2 {
    font-size: 21px;
  }

  .btn-abrir-tv {
    width: 100%;
  }

  .pacientes-fila h3 {
    flex-direction: column;
    align-items: flex-start;
  }

  .fila-item {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }

  .btn-tv {
    width: 100%;
    margin-left: 0;
  }
}

</style> 
</head> 

<body> 
<div class="container"> 

  <!-- Cabeçalho com botão da TV --> 
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"> 
    <h2 style="margin:0;">🏥 Triagem Hospitalar</h2> 
    <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button> 
  </div> 

  <!-- Fila de pacientes do Atendimento criada para mostrar quem pode ser chamado na TV --> 
  <div class="pacientes-fila"> 
    <h3> 
      Pacientes Cadastrados no Atendimento 
      <span>Clique em "Chamar na TV" para chamar ao guichê</span> 
    </h3> 

    <div id="fila-pacientes"> 
      <p style="color:#888; text-align:center;">Carregando...</p> 
    </div> 

    <button onclick="carregarPacientes()" style="margin-top:8px; background:#6c757d; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">🔄 Atualizar lista</button> 
  </div> 

  <hr> 

  <h3>Formulário de Triagem</h3> 
  <input id="nome" placeholder="Nome do paciente"> 

  <select id="sintoma"> 
    <option value="">Selecione o sintoma</option> 
    <option value="dor_leve">Dor leve</option> 
    <option value="resfriado">Resfriado</option> 
    <option value="coriza">Coriza</option> 
    <option value="tosse">Tosse</option> 
    <option value="febre">Febre</option> 
    <option value="vomito">Vômito</option> 
    <option value="diarreia">Diarreia</option> 
    <option value="falta_ar_moderada">Falta de ar moderada</option> 
    <option value="falta_ar_grave">Falta de ar grave</option> 
    <option value="infarto">Suspeita de infarto</option> 
    <option value="avc">Suspeita de AVC</option> 
    <option value="convulsao">Convulsão</option> 
    <option value="hemorragia">Hemorragia</option> 
  </select> 

  <input id="temp" type="number" placeholder="Temperatura"> 
  <input id="alergia" placeholder="Alergias"> 
  <textarea id="observacao" placeholder="Observações"></textarea> 

  <div id="resultado"></div> 

  <button onclick="salvar()">Salvar Triagem</button> 

</div> 

<script> 

function carregarPacientes() { 
  fetch("/pacientes") 
    .then(r => r.json()) 
    .then(pacientes => { 
      const div = document.getElementById("fila-pacientes"); 

      // Mostra apenas os com status "triagem" 
      const fila = pacientes.filter(p => p.status === "triagem"); 

      if (fila.length === 0) { 
        div.innerHTML = "<p style='color:#888; text-align:center;'>Nenhum paciente aguardando.</p>"; 
        return; 
      } 

      div.innerHTML = ""; 
      fila.forEach(p => { 
        const item = document.createElement("div"); 
        item.className = "fila-item"; 
        item.innerHTML = ` 
          <div> 
            <strong>${p.nome}</strong><br> 
            <small>CPF: ${p.cpf || "—"} | Tipo: ${p.tipo || "—"}</small> 
          </div> 
          <button class="btn-tv" onclick="chamarNaTV('${p.nome}')">📺 Chamar na TV</button> 
        `; 
        div.appendChild(item); 
      }); 
    }) 
    .catch(() => { 
      document.getElementById("fila-pacientes").innerHTML = 
        "<p style='color:red;'>Erro ao carregar pacientes.</p>"; 
    }); 
} 

// Função criada para enviar o nome do paciente para a TV quando ele for chamado no guichê. 
function chamarNaTV(nome) { 
  fetch("/tv/chamar", { 
    method: "POST", 
    headers: { "Content-Type": "application/json" }, 
    body: JSON.stringify({ 
      localTipo: "GUICHÊ", 
      localNumero: "01", 
      paciente: nome 
    }) 
  }) 
  .then(r => r.json()) 
  .then(() => { 
    alert("✅ " + nome + " foi chamado na TV para o Guichê 01!"); 
  }); 
} 

function classificarRisco(sintoma, temperatura) { 
  const vermelhos = ["infarto","avc","convulsao","hemorragia","falta_ar_grave"]; 
  const amarelos = ["febre","vomito","diarreia","falta_ar_moderada"]; 
  if (temperatura >= 39) return "vermelho"; 
  if (vermelhos.includes(sintoma)) return "vermelho"; 
  if (amarelos.includes(sintoma)) return "amarelo"; 
  return "verde"; 
} 

function salvar() { 
  const nome = document.getElementById("nome").value; 
  const sintoma = document.getElementById("sintoma").value; 
  const temperatura = Number(document.getElementById("temp").value); 
  const alergia = document.getElementById("alergia").value; 
  const observacao = document.getElementById("observacao").value; 
  const risco = classificarRisco(sintoma, temperatura); 

  fetch("/triagem", { 
    method: "POST", 
    headers: { "Content-Type": "application/json" }, 
    body: JSON.stringify({ nome, sintoma, temperatura, alergia, observacao, risco }) 
  }) 
  .then(r => r.json()) 
  .then(data => { 
    const resultado = document.getElementById("resultado"); 
    resultado.className = risco; 
    resultado.innerHTML = "Classificação: " + risco.toUpperCase(); 
    alert("Triagem salva com sucesso!"); 
  }); 
} 

// Carrega a fila ao abrir a página 
carregarPacientes(); 

// Atualiza a lista automaticamente a cada 10 segundos 
setInterval(carregarPacientes, 10000); 

</script> 

</body> 
</html>
