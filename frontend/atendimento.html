<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;

  background: linear-gradient(135deg, #e3f2fd, #f3e5f5, #ffebee);

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 30px;
}

/* Fundo decorativo infantil */
body::before {
  content: "🩺  💜  🧸  ❤️  ⭐  🏥  🌈";
  position: fixed;
  top: 20px;
  left: 0;
  width: 100%;
  font-size: 35px;
  letter-spacing: 20px;
  text-align: center;
  opacity: 0.25;
  pointer-events: none;
}

.container {
  width: 100%;
  max-width: 520px;

  background: rgba(255, 255, 255, 0.97);

  padding: 35px;
  border-radius: 25px;

  display: flex;
  flex-direction: column;
  gap: 12px;

  border: 3px solid #7b1fa2;

  box-shadow: 0 10px 30px rgba(80, 30, 120, 0.25);
}

/* Logo */
.logo {
  width: 90px;
  height: 90px;
  object-fit: contain;
  margin: 0 auto 5px;
}

/* Título */
h2 {
  text-align: center;
  margin: 0;
  color: #6a1b9a;
  font-size: 30px;
}

/* Frase abaixo do título */
.subtitulo {
  text-align: center;
  font-size: 15px;
  color: #1565c0;
  margin-top: -5px;
  margin-bottom: 10px;
}

input,
select {
  width: 100%;
  padding: 13px;

  border: 2px solid #d1c4e9;
  border-radius: 12px;

  font-size: 15px;
  background: #fafafa;
}

input:focus,
select:focus {
  outline: none;
  border-color: #7b1fa2;
  box-shadow: 0 0 8px rgba(123, 31, 162, 0.25);
}

/* Botão */
button {
  width: 100%;
  padding: 15px;

  border: none;
  border-radius: 12px;

  background: linear-gradient(
    90deg,
    #1565c0,
    #7b1fa2,
    #d32f2f
  );

  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.03);
  box-shadow: 0 5px 15px rgba(80, 30, 120, 0.3);
}

button::before {
  content: "🏥 ";
}

/* Responsividade */
@media (max-width: 600px) {
  body {
    padding: 15px;
  }

  .container {
    padding: 25px 20px;
  }

  h2 {
    font-size: 25px;
  }
}
</style>

</head>

<body>

<div class="container">

<!-- Logo opcional -->
<img src="logo.png" alt="Logo Hospital Pediátrico" class="logo">

<h2>🏥 Cadastro do Paciente</h2>

<div class="subtitulo">
  Atendimento com carinho para cuidar do seu pequeno! 🧸💜
</div>

<input id="Nome" placeholder="Nome">
<input id="CPF" placeholder="CPF">
<input id="Data de Nascimento" placeholder="Data de Nascimento">
<input id="Sexo" placeholder="Sexo">
<input id="Nome da mãe" placeholder="Nome da mãe">
<input id="Estado Civil" placeholder="Estado Civil">
<input id="Endereço" placeholder="Endereço">
<input id="Telefone" placeholder="Telefone">
<input id="E-mail" placeholder="E-mail">
<input id="Contato de emergência" placeholder="Contato de emergência">

<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>

</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{ 
  method:"POST", 
  headers:{"Content-Type":"application/json"}, 
  body: JSON.stringify({ 
    nome: nome.value, 
    cpf: cpf.value, 
    tipo: tipo.value 
  }) 
 }); 
 alert("Paciente enviado para triagem"); 
} 
</script> 
 
</body> 
</html>
